# Local / CPU env for the dyscalculic_ddm DDM fits.
# The modelling heavy lifting lives in bauer. This env pins it to the EXACT
# version the analyses used: the immutable tag **bauer v0.4.0**. For a cluster
# GPU env, install jax[cuda12] on a GPU node instead of plain numpyro.
#
#   conda env create -f environment.yml
#
# bauer v0.4.0 == github.com/ruffgroup/bauer @ commit e406694. Do NOT use
# v0.3.0 or `main`; the 0.4.0 line lives on a divergent branch. The tag below
# resolves to exactly the right commit. See README "Which bauer version".
name: dyscalculic_ddm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - patsy
  - pymc>=5
  - pytensor
  - "arviz<1.0"
  - jupyter
  - jupytext
  - nbformat
  - nbconvert
  - pip:
    - hssm
    - numpyro          # fast NUTS backend (backend='numpyro')
    - blackjax
    # bauer itself (the models live here), pinned to the exact analysis
    # version via the immutable tag v0.4.0.
    - git+https://github.com/ruffgroup/bauer.git@v0.4.0
